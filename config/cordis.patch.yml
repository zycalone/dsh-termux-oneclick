# 手机端 dsh 最终可用配置（整份替换 $DSH_HOME/profiles/web/cordis.patch.yml）
#
# 用法：手机上执行
#   C=~/.dsh/profiles/web/cordis.patch.yml; cp $C $C.bak   # 先备份
#   然后把本文件内容写到 $C
# 说明：
#   * includeHarnessIdentity: false  —— 上游把 "DeepSeek Harness" 字样判为未授权渠道(11-128)，必须关
#   * sandbox-policy / approval / permission —— 安卓无沙箱后端，必须全局 danger-full-access
#   * llm-pi-ai.api: openai-completions —— 走 /v1/chat/completions（/v1/responses 不通用）
#   * 模型 ID 必须手动列出（网关 /v1/models 返回 {"models":[...]}，dsh 按 {"data":[...]} 解析，自动获取会空）
#   * 改完必须【新建会话】才生效（沙箱模式是会话级状态）
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: system-prompt
  name: "@deepseek-ai/dsh-system-prompt"
  config:
    includeHarnessIdentity: false
- id: sandbox-policy
  name: "@deepseek-ai/dsh-sandbox-policy"
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()
- id: approval
  name: "@deepseek-ai/dsh-user-approval"
  config:
    policy: never
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: danger-full-access
        approval: never
      workspace-write:
        sandbox: danger-full-access
        approval: never
      danger-full-access:
        sandbox: danger-full-access
        approval: never
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openai:
        displayName: 本地网关
        api: openai-completions
        baseURL: http://127.0.0.1:8787/v1
        apiKeyEnv: OPENAI_API_KEY
        defaultContextWindow: 131072
        defaultMaxTokens: 32768
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
          - id: glm-5.2
            name: GLM-5.2
          - id: auto
            name: Auto
          # ↓ 视觉模型：input 必须声明 image，否则 dsh 会把图片静默丢弃（只发文字占位）
          # 实测：glm-5v-turbo 可用；其它视觉模型视你的网关而定
          - id: glm-5v-turbo
            name: GLM-5V Turbo (识图)
            input: [text, image]
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: openai
    model: deepseek-v4-flash
